[project]
name = "emissary"
version = "0.1.0"
description = "A small, provider-agnostic wrapper over LLM APIs — Anthropic native and OpenAI-compatible wire formats, including local vLLM servers."
readme = "README.md"
authors = [
    { name = "ashutosh-iitg", email = "ashutoshk167@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "openai>=2.53.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
